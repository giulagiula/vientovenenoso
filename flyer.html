<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flyer_activación</title>
    <link rel="stylesheet" href="style-flyer.css">
</head>
<body>
    <img src="flyer/bg-flyer.png" class="bg">

    <input type="checkbox" id="act" style="display: none;">
    <label for="act" class="loose-btn btn-act">el último soplido</label>  

    <div class="popup act1">
        <p>a días del cierre de la muestra... quedó abierta la ventana, dejamos entrar los últimos resabios del viento venenoso y trajo consigo algunas <label for="sorpresas" class="sorpresas-btn">sorpresas</label></p></p>
        <label for="act" class="close">cerrar</label>
    </div>
    <div class="popup act2">
        <img src="flyer/ventana.jpeg">
        <label for="act" class="close">cerrar</label>
    </div>
    <div class="popup act3">
        <img src="flyer/ventana2.jpg">
        <label for="act" class="close">cerrar</label>
    </div>
    <div class="popup act4">
        <img src="flyer/viento-fb.png">
        <label for="act" class="close">cerrar</label>
    </div>
    <div class="popup act5">
        <img src="flyer/wikihow-ventana.png">
        <label for="act" class="close">cerrar</label>
    </div>
    <div class="popup act6">
        <img src="flyer/wikihow-window.png">
        <label for="act" class="close">cerrar</label>
    </div>

    <input type="checkbox" id="sorpresas" style="display: none;">

    <div class="popup sorpresas1">
        <p>vamos a hacer una activación</p>
        <label for="sorpresas" class="close">cerrar</label>
    </div>
    <div class="popup sorpresas2">
        <p><strong>viernes 23/octubre</strong></p>
        <label for="sorpresas" class="close">cerrar</label>
    </div>
    <div class="popup sorpresas3">
        <p>va a haber torta!!!!!!!</p>
        <label for="sorpresas" class="close">cerrar</label>
    </div>
    <div class="popup sorpresas4">
        <img class="img flicker" src="flyer/tf1.JPG">
        <label for="sorpresas" class="close">cerrar</label>
    </div>
    <div class="popup sorpresas5">
        <img class="img flicker" src="flyer/tf2.JPG">
        <label for="sorpresas" class="close">cerrar</label>
    </div>
    <div class="popup sorpresas6">
        <img class="img flicker" src="flyer/tf3.JPG">
        <label for="sorpresas" class="close">cerrar</label>
    </div>


</body>
</html>
